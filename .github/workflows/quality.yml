name: KaRar Quality Gates & Governance CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Required CI - Lint, Regression & Domain Hash
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Set up Node.js 18
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ezdxf shapely rtree numpy

      - name: "QG-5: Frontend Linter & Type Check"
        run: |
          npm run lint

      - name: "QG-1 & QG-3: Python Regression Tests & Domain Hash Check"
        run: |
          PYTHONPATH=. python3 -m unittest discover -s backend/tests -p "test_*.py"
          PYTHONPATH=. python3 backend/run_regression_tests.py
