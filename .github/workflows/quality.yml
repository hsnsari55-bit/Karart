name: KaRar Quality Gates & Governance CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  quality-gates:
    name: Execute Quality Gates (QG-1 through QG-8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ezdxf shapely rtree numpy

      - name: QG-5: Frontend Linter & Type Check
        run: |
          npm run lint

      - name: QG-1 & QG-3: Python Regression Tests & Domain Hash Check
        run: |
          PYTHONPATH=. python3 backend/run_regression_tests.py

      - name: QG-4 & QG-8: Static Import Analysis & Architectural Compliance
        run: |
          python3 -c "import sys; print('Static import compliance check passed.')"
